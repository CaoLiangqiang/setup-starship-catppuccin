name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify skill discovery
        run: npx --yes skills add . --list | grep -F 'setup-starship-catppuccin'

      - name: Verify bundled fonts
        working-directory: assets/fonts
        run: sha256sum -c SHA256SUMS

      - name: Check Bash
        run: |
          bash -n scripts/*.sh tests/*.sh
          shellcheck -x scripts/*.sh tests/*.sh

      - name: Test Linux installer
        run: bash tests/test-configure-starship.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem scripts,tests -Filter '*.ps1' -Recurse | ForEach-Object {
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$fileErrors) | Out-Null
            $errors += $fileErrors
          }
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Test Windows installer
        shell: powershell
        run: .\tests\test-configure-starship-windows.ps1
